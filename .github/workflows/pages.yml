name: Deploy benchmark website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "registry.html"
      - "assets/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Assemble static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html registry.html _site/
          cp assets/* _site/assets/
          cp data/*.js _site/data/
          cp LICENSE _site/LICENSE
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
